<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, .16), transparent 28rem),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, .14), transparent 30rem),
        #09090b;
    }

    main {
      position: relative;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 12vw, 8rem);
      line-height: .9;
      letter-spacing: -.07em;
      font-weight: 750;
      background: linear-gradient(135deg, #fff 20%, #94a3b8 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 1.5rem 0 0;
      color: #a1a1aa;
      font-size: clamp(.9rem, 2vw, 1.1rem);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 18rem;
      height: 18rem;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 50%;
      box-shadow: 0 0 7rem rgba(56, 189, 248, .08);
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
    <p>Something great is on the way</p>
  </main>
</body>
</html>
